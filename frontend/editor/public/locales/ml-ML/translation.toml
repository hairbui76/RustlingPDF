[onboarding.desktopInstall]
body = "Rustling ഡെസ്ക്ടോപ്പ് ആപ്പായി പ്രവർത്തിക്കുമ്പോൾ ഏറ്റവും മികച്ചതാണ്. നിങ്ങൾക്ക് ഓഫ്‌ലൈൻ ഉപയോഗിക്കാം, ഡോക്യുമെന്റുകൾ വേഗത്തിൽ ആക്‌സസ് ചെയ്യാം, നിങ്ങളുടെ കമ്പ്യൂട്ടറിൽ ലൊക്കലായി എഡിറ്റ് ചെയ്യാനും കഴിയും."
selectOs = "ഓപ്പറേറ്റിംഗ് സിസ്റ്റം തിരഞ്ഞെടുക്കുക"
title = "ഡൗൺലോഡ്"
titleWithOs = "{{osLabel}}-ക്കായി ഡൗൺലോഡ്"

[onboarding.tourOverview]
body = "RustlingPDF V2 ഡസൻകണക്കിന് ഉപകരണങ്ങളും പുതുക്കിയ ലേഔട്ടും ഉൾപ്പെടുത്തി എത്തുന്നു. എന്താണ് മാറിയതെന്നും നിങ്ങൾക്ക് ആവശ്യമായ സവിശേഷതകൾ എവിടെയാണെന്നും വേഗത്തിൽ കാണാം."
title = "ടൂർ അവലോകനം"

[onboarding.welcomeSlide]
body = "RustlingPDF ഇനി എല്ലാ വലുപ്പത്തിലുള്ള ടീമുകൾക്കുമൊത്ത് തയ്യാറായി. ഈ അപ്‌ഡേറ്റിൽ ഒരു പുതിയ ലേഔട്ട്, ശക്തമായ പുതിയ അഡ്മിൻ കഴിവുകൾ, കൂടാതെ ഏറ്റവും ആവശ്യപ്പെട്ട ഫീച്ചർ - <strong>Edit Text</strong> ഉൾപ്പെടുന്നു."
title = "Rustling-ിലേക്ക് സ്വാഗതം"

[onboarding.whatsNew]
activeFilesView = "തുറന്നിട്ടിരിക്കുന്ന എല്ലാം കാണാനും എന്തിൽ പ്രവർത്തിക്കണമെന്നത് തിരഞ്ഞെടുക്കാനും Active Files ഉപയോഗിക്കുക."
fileUpload = "<strong>Files</strong> ബട്ടൺ ഉപയോഗിച്ച് അപ്‌ലോഡ് ചെയ്യുക അല്ലെങ്കിൽ അടുത്തിടെ ഉപയോഗിച്ച PDF തിരഞ്ഞെടുക്കുക. വർക്‌സ്‌പേസ് കാണാൻ ഒരു സാമ്പിൾ ഞങ്ങൾ ലോഡ് ചെയ്യും."
leftPanel = "ഇടത്തേയുള്ള <strong>Tools</strong> പാനൽ നിങ്ങൾക്ക് ചെയ്യാവുന്ന എല്ലാം പട്ടികപ്പെടുത്തുന്നു. വിഭാഗങ്ങൾ ബ്രൗസ് ചെയ്യുകയോ ഒരു ടൂൾ പെട്ടെന്ന് കണ്ടെത്താൻ തിരയുകയോ ചെയ്യുക."
pageEditorView = "പേജുകൾ പുനഃക്രമീകരിക്കാൻ, ഭ്രമിപ്പിക്കാൻ, അല്ലെങ്കിൽ ഇല്ലാതാക്കാൻ Page Editor-ിലേക്ക് മാറുക."
quickAccess = "Reader, Automate, നിങ്ങളുടെ ഫയലുകൾ, എല്ലാ ടൂറുകളും എന്നിവയ്ക്ക് ഇടയിൽ മാറാൻ <strong>Quick Access</strong> റെയിലിൽ നിന്ന് ആരംഭിക്കുക."
topBar = "മുകളിലെ ബാർ <strong>Viewer</strong>, <strong>Page Editor</strong>, <strong>Active Files</strong> എന്നിവയ്ക്ക് ഇടയിൽ മാറാൻ അനുവദിക്കുന്നു."
wrapUp = "V2യിലെ പുതുമകൾ ഇത്രയാണ്. ഇത്, Tools ടൂർ, അല്ലെങ്കിൽ Admin ടൂർ വീണ്ടും കാണാൻ ഏതുസമയവും <strong>Tours</strong> മെനു തുറക്കുക."

