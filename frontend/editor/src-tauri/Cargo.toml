[package]
name = "rustlingpdf"
version = "0.1.0"
description = "RustlingPDF Desktop Application"
authors = ["RustlingPDF Contributors"]
license = "MIT"
repository = "https://github.com/hairbui76/RustlingPDF"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
warnings = "deny"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [ "devtools"] }
tauri-plugin-log = "2.8.0"
tauri-plugin-shell = "2.3.4"
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-http = { version = "2.5.8", features = ["dangerous-settings"] }
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-store = "2.4.2"
tauri-plugin-opener = "2.5.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-window-state = "2.2.1"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
tokio = { version = "1.50", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
url = "2.5"
urlencoding = "2.1"

[dev-dependencies]
# Test-only additions on top of the runtime `tokio` features: a runtime and
# macros for #[tokio::test], and test-util for the paused-clock timing tests
# in launch_intent.rs.
tokio = { version = "1.50", features = ["macros", "rt", "test-util", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-services = "1.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3.2", features = ["NSObject", "NSString", "NSURL"] }
objc2-pdf-kit = { version = "0.3.2", features = ["PDFDocument", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_ApplicationInstallationAndServicing",
] }

[profile.release]
# The desktop shell is its own workspace, so the profile in rust/Cargo.toml
# does not reach it — this binary was still being built with cargo's defaults
# while the sidecar next to it in the same installer was not. It carries the
# whole embedded frontend plus the Tauri runtime and shipped at 42.2 MB with
# symbols retained; stripping alone accounts for 6.3 MB of that.
#
# Same settings and the same reasoning as the sidecar's profile: read
# rust/Cargo.toml for the measurements, for why LTO is thin rather than fat,
# and for why `panic` stays "unwind".
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
