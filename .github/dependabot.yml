# Dependabot: weekly dependency PRs for every ecosystem in the repository.
#
# Grouping policy: patch + minor updates are batched into one PR per
# ecosystem (low-risk, gate-verified in bulk); major updates always arrive as
# individual PRs so breaking changes get reviewed one at a time. Every PR
# still has to pass the matching CI gate (backend.yml / frontend.yml /
# differential-smoke.yml) before merge.
#
# Ecosystems:
#   cargo /rust                       — the backend workspace (Cargo.lock committed,
#                                       gates run with --locked)
#   cargo /frontend/editor/src-tauri  — the Tauri desktop shell (its own lockfile)
#   cargo /frontend/editor/src-tauri/provisioner        — standalone Windows MSI
#   cargo /frontend/editor/src-tauri/thumbnail-handler    helper crates (own lockfiles,
#                                                         not workspace members)
#   npm   /frontend                   — the npm workspace root (frontend/package-lock.json)
#   github-actions /                  — workflow actions; Dependabot natively updates
#                                       full-SHA pins and their "# vX.Y.Z" comments,
#                                       preserving the house pinning style
#
# Commit-message prefixes follow the repo's conventional-commit style
# (build:/ci:).

version: 2

updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      rust-backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # sha2 0.11 rides the digest-0.11 RustCrypto line; hkdf (and friends)
      # have no compatible release yet, so the bump cannot compile until the
      # ecosystem moves together (dependabot PR #11, closed 2026-07-28).
      # Revisit when hkdf/hmac ship digest-0.11-compatible majors.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/frontend/editor/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
    groups:
      tauri-shell-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/frontend/editor/src-tauri/provisioner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      provisioner-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/frontend/editor/src-tauri/thumbnail-handler"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
    groups:
      thumbnail-handler-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # vite 8 conflicts with the installed plugin family's peer ranges
      # (dependabot PR #12, closed 2026-07-28); a vite major is a deliberate
      # coordinated upgrade with its plugins, not a drive-by bump.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # Mantine majors must move as one family (@mantine/core, /hooks,
      # /dropzone, ...): a lone @mantine/dropzone 9 fails @mantine/core 8
      # peer deps (dependabot PR #14, closed 2026-07-28). Coordinated
      # Mantine-9 upgrade is a roadmap follow-up.
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
