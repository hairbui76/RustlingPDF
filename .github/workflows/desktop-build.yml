name: Desktop build (reusable)

# Reusable matrix build for the Tauri desktop bundles. Called by:
#   - release.yml (publish-desktop job) on release tags, and
#   - desktop-release-dryrun.yml for manually dispatched proof runs.
#
# Legs (see the plan job): ubuntu-latest builds AppImage + deb for
# linux-x86_64, windows-latest builds the WiX MSI for windows-x86_64, and
# macos-latest (Apple silicon) builds .app + dmg for darwin-aarch64. Each leg
# stages the release Rust backend as the Tauri externalBin sidecar plus the
# pinned PDFium, qpdf, and Tesseract runtimes
# (`task desktop:stage-sidecar`), prepares the desktop frontend, runs
# `npx tauri build`,
# and uploads the bundles as an artifact named desktop-<os>-<arch>, which
# release.yml downloads and attaches to the GitHub release.
#
# Bundle signing: with sign=true (the default and what both callers pass),
# `tauri build` signs the signable bundles (.AppImage/.deb on linux, .msi on
# windows, .app.tar.gz on macos) with the minisign key from the
# TAURI_SIGNING_PRIVATE_KEY secret — the counterpart of the committed
# minisign public key — and the collect step fails if any expected .sig is
# missing. sign=false builds with --no-sign for keyless smoke runs. The .sig
# files are published as release assets alongside the bundles so a manual
# downloader can verify what they got; nothing in the app consumes them, and
# no update manifest is produced.
#
# Bundle file names are renamed space→dot before upload: GitHub release
# assets get the same rename server-side, so doing it here keeps local file
# names identical to the release asset names. With productName "RustlingPDF"
# (no space) this is a no-op safeguard — it only fires again if a space ever
# re-enters the product name.
#
# The windows leg additionally runs the MSI through a real
# install -> assert -> uninstall -> assert lifecycle check
# (src-tauri/windows/scripts/verify-msi-lifecycle.ps1) after uploading its
# artifact: WiX is Windows-only, so this is the only place the uninstall
# cleanup contract in rust/contracts/desktop-windows-installer.md can be
# proven rather than desk-checked.
#
# harden-runner only guards the Linux legs: step-security/harden-runner
# supports Linux runners only (documented upstream), so the windows/macos
# matrix legs run without it.

on:
  workflow_call:
    inputs:
      sign:
        description: "Sign the desktop bundles with the TAURI_SIGNING_PRIVATE_KEY secret"
        type: boolean
        default: true
      platforms:
        description: "Matrix legs to run: all | linux-only"
        type: string
        default: all
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: "Minisign private key matching the committed public key (required when sign=true)"
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: "Password for the private key (empty string for a passwordless key)"
        required: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The matrix legs live here (not inline in the strategy) so the
      # platforms input can select a subset. The {os}-{arch} platform values
      # name each leg's uploaded artifact (desktop-<os>-<arch>).
      - name: Compute the build matrix
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          linux='{"os":"ubuntu-latest","platform":"linux-x86_64","bundles":"appimage,deb"}'
          windows='{"os":"windows-latest","platform":"windows-x86_64","bundles":"msi"}'
          # macOS is paused ("coming soon"): pulled from the default matrix by
          # the maintainer on 2026-08-04 — the leg roughly doubled release
          # wall-clock and no macOS build is being shipped for now. The leg
          # definition stays; bringing it back is selecting 'all-with-macos'
          # or moving it back into the 'all' case.
          macos='{"os":"macos-latest","platform":"darwin-aarch64","bundles":"app,dmg"}'

          case "${PLATFORMS}" in
            all)             matrix="[${linux},${windows}]" ;;
            all-with-macos)  matrix="[${linux},${windows},${macos}]" ;;
            linux-only)      matrix="[${linux}]" ;;
            *)
              echo "::error::Unknown platforms input '${PLATFORMS}' (expected 'all', 'all-with-macos' or 'linux-only')."
              exit 1
              ;;
          esac

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "Matrix: ${matrix}"

  build:
    name: Build desktop bundles (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    # The release build of the Rust backend sidecar alone takes 30–45 min
    # cold on a hosted runner, before the Tauri shell compile, the Vite
    # desktop build and platform bundling on top. 120 covers the uncached
    # worst case; rust-cache-warmed runs finish far under it.
    timeout-minutes: 120
    strategy:
      # One failing leg must not cancel the others: each leg's log is the
      # only diagnostic for its platform (there is no local windows/macos
      # environment to reproduce on).
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        # Uniform scripting across the matrix; resolves to Git Bash on the
        # windows runner (which is also what `task` invokes for the staging
        # scripts).
        shell: bash
    steps:
      - name: Harden the runner (audit egress — Linux legs only)
        # step-security/harden-runner supports Linux runners only; the
        # windows/macos legs necessarily run unguarded.
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same package set as the Desktop CI gate: webkit2gtk/gtk/soup/rsvg/
      # appindicator are what tauri (wry/gtk) links against, xdo backs the
      # global-shortcut input plumbing. The windows and macos legs need no
      # extra system packages: the Tauri CLI fetches WiX/NSIS on demand on
      # Windows, and macOS ships everything (WebKit is a system framework).
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            desktop-file-utils \
            zsync \
            xdg-utils \
            shared-mime-info \
            file \
            squashfs-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          # Matches the toolchain used by the backend and desktop CI gates.
          toolchain: 1.94.0

      # Two cargo roots build in every leg (backend workspace + Tauri shell);
      # the two standalone Windows-installer helper crates only build on the
      # windows leg (their empty target dirs are harmless elsewhere).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.platform }}
          workspaces: |
            rust -> target
            frontend/editor/src-tauri -> target
            frontend/editor/src-tauri/provisioner -> target
            frontend/editor/src-tauri/thumbnail-handler -> target

      # Node 22 to match the Frontend CI gate (see frontend.yml for the
      # version rationale).
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Builds the release rustling-processing binary, installs the pinned
      # PDFium, qpdf, and Tesseract runtimes (platform-dispatched checksum-
      # verified installers), then stages them into src-tauri.
      - name: Stage the Rust sidecar and native runtimes (task desktop:stage-sidecar)
        run: task desktop:stage-sidecar

      # Diagnostic listing so a bad staging layout is visible in the log
      # without a local reproduction environment for the platform.
      - name: Show staged native runtime layout
        run: |
          ls -la frontend/editor/src-tauri/binaries/
          ls -la frontend/editor/src-tauri/resources/pdfium/
          find frontend/editor/src-tauri/resources/tools -type f -print | sort
          du -sk frontend/editor/src-tauri/resources/tools
          du -sh frontend/editor/src-tauri/resources/tools

      # Frontend desktop env files, icons and OG metadata; on the windows leg
      # this also builds the MSI provisioner + thumbnail-handler helper
      # binaries into src-tauri/windows/wix/ (task desktop:provisioner is
      # platforms: [windows]). The stage-sidecar dependency re-runs as a
      # cheap incremental no-op.
      - name: Prepare the desktop frontend (task desktop:prepare)
        run: task desktop:prepare

      # The bundler signs the signable bundles in place (.sig siblings) when
      # the signing env is present; --no-sign (sign=false) skips signing
      # entirely for keyless runs. CI=true on hosted runners already
      # suppresses CLI prompting.
      #
      # NOTE: emitting .sig files depends on tauri.conf.json keeping
      # `createUpdaterArtifacts: true`. The app does not check for updates,
      # but that bundler flag is what produces the signatures we publish for
      # manual verification — the collect step below fails the build if they
      # ever stop appearing.
      - name: Build Tauri bundles (${{ matrix.bundles }})
        working-directory: frontend/editor
        env:
          BUNDLE_SIGN: ${{ inputs.sign }}
          BUNDLES: ${{ matrix.bundles }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ubuntu-24.04 runners ship no libfuse2, so the linuxdeploy /
          # appimagetool AppImages cannot mount themselves ("failed to run
          # linuxdeploy"); self-extraction sidesteps FUSE entirely. NO_STRIP
          # keeps linuxdeploy's strip pass off, matching the proven
          # containerized e2e environment. Both are ignored off-Linux.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          set -euo pipefail
          # --verbose keeps the underlying bundler tools' output (linuxdeploy,
          # WiX, hdiutil) in the log — without it a bundling failure surfaces
          # only as "failed to run <tool>" with the real error swallowed.
          args=(build --verbose --bundles "${BUNDLES}")
          if [ "${BUNDLE_SIGN}" != "true" ]; then
            args+=(--no-sign)
          fi
          npx tauri "${args[@]}"

      # Repack the Linux bundles with stronger compression and re-sign them.
      # Tauri writes the deb's data.tar with gzip and the AppImage's squashfs
      # with light zstd; the identical content costs 25% / 8% less repacked
      # (measured on the v0.0.5 artifacts). Runs between build and collect
      # because tauri signs during build — a later repack would orphan the
      # .sig — and the script re-signs with the same key from the same env.
      # Each repacked artifact is verified before it replaces the original:
      # dpkg-deb must parse the deb, and the AppImage must self-extract with
      # its own runtime (which exits 0 even on failure, so the script checks
      # the extraction produced AppRun rather than trusting the exit code).
      - name: Recompress Linux bundles
        if: runner.os == 'Linux'
        working-directory: frontend/editor
        env:
          # `sign` is a boolean input; a string compare against 'true' here
          # would coerce and silently disable signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.sign && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash src-tauri/scripts/recompress-linux-bundles.sh src-tauri/target/release/bundle

      # Flatten the bundle outputs into one directory, renaming space→dot
      # (see the header comment; a no-op for the spaceless "RustlingPDF"
      # product name), and require a .sig sibling for every signable bundle
      # when signing was requested. The signatures ship as release assets so
      # a manual download can be verified against the public key.
      - name: Collect bundles and signatures
        env:
          BUNDLE_SIGN: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          bundle_root="frontend/editor/src-tauri/target/release/bundle"
          stage="dist-desktop"
          mkdir -p "${stage}"
          shopt -s nullglob

          count=0
          for f in "${bundle_root}"/*/*.AppImage "${bundle_root}"/*/*.AppImage.sig \
                   "${bundle_root}"/*/*.deb "${bundle_root}"/*/*.deb.sig \
                   "${bundle_root}"/*/*.rpm "${bundle_root}"/*/*.rpm.sig \
                   "${bundle_root}"/*/*.msi "${bundle_root}"/*/*.msi.sig \
                   "${bundle_root}"/*/*-setup.exe "${bundle_root}"/*/*-setup.exe.sig \
                   "${bundle_root}"/*/*.app.tar.gz "${bundle_root}"/*/*.app.tar.gz.sig \
                   "${bundle_root}"/*/*.dmg; do
            base="$(basename "${f}")"
            cp -f "${f}" "${stage}/${base// /.}"
            count=$((count + 1))
          done

          if [ "${count}" -eq 0 ]; then
            echo "::error::No bundle outputs found under ${bundle_root}."
            find "${bundle_root}" -maxdepth 2 || true
            exit 1
          fi

          if [ "${BUNDLE_SIGN}" = "true" ]; then
            for f in "${stage}"/*.AppImage "${stage}"/*.deb "${stage}"/*.rpm \
                     "${stage}"/*.msi "${stage}"/*-setup.exe "${stage}"/*.app.tar.gz; do
              if [ ! -f "${f}.sig" ]; then
                echo "::error::Missing signature for ${f}."
                exit 1
              fi
            done
          fi

          echo "Collected bundles:"
          ls -la "${stage}"

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-desktop/
          if-no-files-found: error

      # Install -> assert -> uninstall -> assert on the MSI that was just
      # built. WiX is Windows-only and MSI semantics cannot be emulated, so
      # this runner is the only place the uninstall-cleanup contract
      # (rust/contracts/desktop-windows-installer.md) can be proven: that the
      # registry keys provisioning.wxs authors are actually gone afterwards,
      # that the provisioning file is removed while the user's own state in the
      # same directory survives, and that Add/Remove Programs offers Uninstall.
      #
      # Deliberately placed AFTER the artifact upload: a bundle that fails this
      # check is still downloadable for diagnosis, and the job then fails, so a
      # non-uninstallable MSI cannot be released. Hosted runners are ephemeral
      # and admin, and already carry the WebView2 Runtime, so the install's
      # bootstrapper CustomAction is skipped.
      - name: Verify MSI install/uninstall lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist-desktop -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "No .msi found in dist-desktop" }
          & frontend/editor/src-tauri/windows/scripts/verify-msi-lifecycle.ps1 -MsiPath $msi.FullName -LogDirectory msi-lifecycle-logs
          exit $LASTEXITCODE

      - name: Upload MSI lifecycle logs
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-lifecycle-logs-${{ matrix.platform }}
          path: msi-lifecycle-logs/
          if-no-files-found: ignore
