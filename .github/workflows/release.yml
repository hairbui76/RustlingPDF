name: Release

# Release pipeline for tagged builds: verify the version discipline, publish
# both Docker images to GHCR, build + sign the desktop bundles on the
# three-OS matrix, and create the GitHub release with the desktop artifacts
# attached.
#
# Trigger contract: push a tag `v<version>` where `<version>` is exactly the
# contents of rust/VERSION (the canonical version source, consumed by
# rustling-processing's build.rs). The verify-version job fail-fasts when the
# tag and the versioned files disagree — including suffixed tags like
# v2.14.2-rc1, which are rejected on purpose: this pipeline only publishes
# exact releases, and RELEASING.md documents the full bump checklist.
# workflow_dispatch exists solely to re-run the pipeline for an existing v*
# tag (dispatch it from the tag ref); dispatching from a branch fails the
# same guard.
#
# Images: ghcr.io/<owner>/rustlingpdf (default `runtime` target — backend +
# baked-in SPA + PDFium + external tools) and
# ghcr.io/<owner>/rustlingpdf-ai-engine (slim optional sidecar), both built
# from docker/Dockerfile, tagged `v<version>` and `latest`, linux/amd64.
# GHCR requires lowercase image names, so the owner is lowercased in-job.
# OCI version/source/revision/created labels are supplied through the
# Dockerfile's ARG plumbing (defaults keep plain local `task docker:build`
# working with no arguments).
#
# Caching: the Dockerfile's BuildKit cache mounts (cargo registry + target)
# do not persist on hosted runners, and the `type=gha` layer cache that used
# to sit here is gone. It could never hit. This workflow runs on tags, GitHub
# scopes a cache to the ref that wrote it, and nothing writes `scope=release`
# on main — so every release exported blobs into `refs/tags/vX.Y.Z` that the
# next release, on a different tag, could not read. The two image builds do
# share their common stages (rust-build, frontend-build, pdfium), but through
# the builder's LOCAL state within the run, which needs no export.
#
# The export was not free: mode=max took publish-images 1275s at v0.1.5,
# mode=min 836s at v0.1.6, and removing it should take back the rest, plus
# ~560 MB per release of the repository's 10 GB cache budget.
#
# The one case this loses: re-running the SAME tag after a transient failure
# no longer restores its own layers and rebuilds the images. That is rare and
# was judged the cheaper side. If image builds ever start running on main,
# reinstate `cache-from`/`cache-to` here — then the scope would be readable.
#
# Desktop bundles: publish-desktop calls the reusable desktop-build workflow
# (linux deb, windows MSI + NSIS setup.exe; AppImage and macOS are paused —
# "coming soon"), signing the bundles with the TAURI_SIGNING_PRIVATE_KEY
# secret (counterpart of the committed minisign public key). github-release
# then downloads the desktop-<os>-<arch> artifacts and uploads the bundles
# together with their `.sig` signature files to the release, so anyone
# downloading a build can verify it against the public key. It also
# generates and uploads latest.json, the tauri-updater manifest the desktop
# app's startup check reads (endpoint pinned in tauri.conf.json; the check
# can be turned off in Settings -> General). The manifest carries the MSI
# and NSIS entries for windows-x86_64 — deb/rpm installs update through
# their package manager. Asset uploads use --clobber so a re-run after a
# transient failure completes an existing release idempotently instead of
# erroring.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress deliberately deviates from the CI workflows' `true`:
# cancelling a half-finished image publish or release creation mid-flight
# would leave a partly published version. Runs for the same tag queue instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The single source of truth is rust/VERSION; the tag and every
      # hard-coded version site must move in lockstep (RELEASING.md has the
      # checklist). Exact string equality — no prefixes, no -rc/-beta
      # suffixes — so a stray pre-release tag can never publish `latest`.
      - name: Verify tag matches rust/VERSION and tauri.conf.json
        id: verify
        run: |
          set -euo pipefail

          case "${GITHUB_REF}" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            *)
              echo "::error::Release runs must start from a tag ref, got '${GITHUB_REF}'."
              echo "Push a release tag (git tag vX.Y.Z && git push origin vX.Y.Z) or dispatch this workflow from an existing v* tag. See RELEASING.md."
              exit 1
              ;;
          esac

          version="$(tr -d '[:space:]' < rust/VERSION)"
          expected="v${version}"

          if [ "${tag}" != "${expected}" ]; then
            echo "::error::Tag '${tag}' does not exactly match '${expected}' (\"v\" + rust/VERSION)."
            echo "Suffixed tags (e.g. '${expected}-rc1') are rejected by design: this pipeline publishes exact releases only."
            echo "See RELEASING.md for the version-bump checklist — rust/VERSION and every hard-coded version site move in lockstep."
            exit 1
          fi

          tauri_version="$(jq -r '.version' frontend/editor/src-tauri/tauri.conf.json)"
          if [ "${tauri_version}" != "${version}" ]; then
            echo "::error::frontend/editor/src-tauri/tauri.conf.json .version is '${tauri_version}' but rust/VERSION is '${version}'."
            echo "The bump checklist in RELEASING.md updates rust/VERSION and every hard-coded version site (tauri.conf.json included) in lockstep."
            exit 1
          fi

          echo "Verified: tag ${tag} == v + rust/VERSION, tauri.conf.json agrees (${version})."
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  publish-images:
    needs: verify-version
    runs-on: ubuntu-latest
    # Cold multi-stage build on a 4-vCPU hosted runner: full cargo release
    # build of the workspace plus the Vite production build plus LibreOffice/
    # Tesseract apt layers. 120 gives the uncached worst case headroom;
    # gha-cache-warmed runs finish far under it.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase repository paths, and github.repository_owner
      # preserves the owner's display casing — lowercase it once here. The
      # OCI `created` timestamp is computed at build time (UTC, RFC 3339).
      - name: Compute image coordinates
        id: meta
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "runtime_image=ghcr.io/${owner}/rustlingpdf" >> "${GITHUB_OUTPUT}"
          echo "ai_image=ghcr.io/${owner}/rustlingpdf-ai-engine" >> "${GITHUB_OUTPUT}"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.runtime_image }}:${{ needs.verify-version.outputs.tag }}
            ${{ steps.meta.outputs.runtime_image }}:latest
          build-args: |
            VERSION=${{ needs.verify-version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      # Shares the rust-build stage with the runtime build above: the buildx
      # builder's local state plus the scope=release gha cache make this an
      # assembly-only build in the common case.
      - name: Build and push AI-engine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: ai-engine
          push: true
          tags: |
            ${{ steps.meta.outputs.ai_image }}:${{ needs.verify-version.outputs.tag }}
            ${{ steps.meta.outputs.ai_image }}:latest
          build-args: |
            VERSION=${{ needs.verify-version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

  # The desktop bundle matrix lives in the reusable workflow (also used by
  # the desktop-release-dryrun proof workflow); its legs run in parallel
  # with publish-images.
  publish-desktop:
    needs: verify-version
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: read
    with:
      sign: true
      platforms: all
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  github-release:
    needs: [verify-version, publish-images, publish-desktop]
    runs-on: ubuntu-latest
    # Downloading and re-uploading ~1 GB of desktop bundles dominates this
    # job; 20 keeps slow-transfer headroom over the old notes-only 10.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each matrix leg's artifact lands in its own desktop-<os>-<arch>
      # subdirectory (merge-multiple stays false) so bundles from different
      # platforms cannot collide on identical file names before upload.
      - name: Download desktop bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: desktop-artifacts

      # `gh release create` with the built-in GITHUB_TOKEN instead of a
      # third-party release action: one less supply-chain pin, and the gh CLI
      # ships on the hosted runner. --generate-notes appends the
      # auto-generated changelog after the pull-commands body; --verify-tag
      # refuses to mint a release for a tag that is not on the remote. The
      # existence guard plus --clobber uploads make workflow_dispatch re-runs
      # (e.g. after a transient publish failure) idempotent instead of
      # erroring: an existing release keeps its notes and gets its assets
      # completed/refreshed.
      - name: Create GitHub release and upload desktop assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-version.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; keeping its notes and re-uploading assets (idempotent re-run)."
          else
            owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            notes="${RUNNER_TEMP}/release-notes.md"
            cat > "${notes}" <<EOF
          ## Container images

          Published to GitHub Container Registry by this release run:

          \`\`\`bash
          docker pull ghcr.io/${owner}/rustlingpdf:${TAG}
          docker pull ghcr.io/${owner}/rustlingpdf-ai-engine:${TAG}   # optional AI sidecar
          \`\`\`

          Both are also tagged \`latest\`. Run instructions: rust/RUNNING_WITH_RUST.md, section "Docker".

          ## Desktop apps

          Installers built and signed by this release run, attached below: Linux (\`.deb\`; AppImage is paused — coming soon), Windows (\`-setup.exe\` — the smaller download — or \`.msi\` for msiexec/GPO deployment; pick one and stay on it, updates keep whichever you installed). Each signed bundle has a \`.sig\` file next to it so you can verify your download against the project's minisign public key.

          At startup the desktop app asks this releases page once whether a newer version exists (Settings -> General turns that off); nothing else is ever sent anywhere. Updates install only when you ask, and every download is verified against the signing key first.
          EOF

            gh release create "${TAG}" \
              --verify-tag \
              --title "RustlingPDF ${TAG}" \
              --generate-notes \
              --notes-file "${notes}"
          fi

          # Bundle + .sig names contain no spaces (the build workflow
          # renames space→dot exactly as GitHub asset upload would), so the
          # uploaded asset names match the local file names people verify
          # against.
          gh release upload "${TAG}" --clobber \
            desktop-artifacts/*/*

      # The tauri-updater manifest the desktop app's startup check reads from
      # .../releases/latest/download/latest.json. The platform keys are the
      # per-installer form `{os}-{arch}-{installer}` that tauri-plugin-updater
      # searches FIRST (updater.rs get_urls; the running app knows how it was
      # installed via tauri's baked-in bundle_type marker):
      #
      #   windows-x86_64-msi   -> the MSI     (an MSI install updates via MSI)
      #   windows-x86_64-nsis  -> setup.exe   (an NSIS install stays NSIS)
      #
      # AppImage is paused ("coming soon") as of 2026-08-04; v0.1.0 shipped
      # the last one, so its `linux-x86_64-appimage` entry is gone. Known
      # consequence, accepted: existing AppImage installs (v0.0.8–v0.1.0)
      # get TargetNotFound from their update check and go silent — they
      # will not learn about newer versions until AppImage returns.
      # Restoring it means re-adding the entry here AND "appimage" to the
      # linux bundles list in desktop-build.yml, together.
      #
      # Deliberately NO bare `{os}-{arch}` fallback keys: a fallback would
      # match installs that must not in-place update (deb/rpm via the package
      # manager, portable/dev runs) and cross-grade them onto the wrong
      # installer, leaving two Add/Remove entries on Windows. Without a
      # fallback those installs get TargetNotFound from check(), which the
      # frontend bridge swallows silently by design.
      #
      # The `signature` fields carry the same minisign signatures uploaded as
      # .sig assets — the app verifies the download against the committed
      # public key before installing. Generated after the asset upload so
      # the URLs it points at already resolve; uploaded with --clobber for
      # the same idempotent re-run behaviour as the assets themselves.
      #
      # A missing artifact or signature fails this step: a release must never
      # go out with a manifest pointing at assets that are not there, and
      # never silently without a manifest.
      - name: Generate and upload the updater manifest (latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-version.outputs.tag }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          msi=(desktop-artifacts/desktop-windows-x86_64/*.msi)
          nsis=(desktop-artifacts/desktop-windows-x86_64/*-setup.exe)
          for f in "${msi[0]}" "${nsis[0]}"; do
            [ -f "${f}" ] || { echo "::error::Updater manifest input missing: ${f}"; exit 1; }
            [ -f "${f}.sig" ] || { echo "::error::Signature missing: ${f}.sig"; exit 1; }
          done

          jq -n \
            --arg version "${version}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --arg msi_url "${base_url}/$(basename "${msi[0]}")" \
            --arg msi_sig "$(cat "${msi[0]}.sig")" \
            --arg nsis_url "${base_url}/$(basename "${nsis[0]}")" \
            --arg nsis_sig "$(cat "${nsis[0]}.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64-msi": { url: $msi_url, signature: $msi_sig },
                "windows-x86_64-nsis": { url: $nsis_url, signature: $nsis_sig }
              }
            }' > latest.json

          echo "Updater manifest:"
          cat latest.json

          gh release upload "${TAG}" --clobber latest.json
