version: '3'

tasks:
  prepare:
    desc: "Prepare desktop build dependencies"
    deps:
      - task: ":frontend:prepare"
        vars: { MODE: desktop }
      - provisioner
      - stage-sidecar

  stage-sidecar:
    desc: "Build the release Rust backend + pinned native runtimes and stage them for Tauri bundling"
    cmds:
      # Release build of the processing backend (the desktop sidecar).
      - cargo build --release --locked -p rustling-processing --manifest-path ../rust/Cargo.toml
      # Pinned, checksum-verified PDFium runtime into rust/.pdfium/current.
      # Both installers produce the same layout — the platform shared library
      # (libpdfium.so / libpdfium.dylib / pdfium.dll) at the directory root
      # plus the PDFium LICENSE files — which is exactly what the backend's
      # directory-form RUSTLING_PDFIUM_LIBRARY_PATH resolution expects.
      - cmd: bash ../rust/scripts/install-pdfium.sh
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File ../rust/scripts/install-pdfium.ps1
        platforms: [windows]
      # Pinned, checksum-verified qpdf + Tesseract runtime into
      # rust/.desktop-tools/current.
      - cmd: bash ../rust/scripts/install-desktop-tools.sh
        platforms: [linux, darwin]
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File ../rust/scripts/install-desktop-tools.ps1
        platforms: [windows]
      # Copy all native inputs into src-tauri
      # (binaries/<name>-<triple>[.exe], resources/pdfium/,
      # resources/tools/). Runs under Git Bash on Windows.
      - bash editor/src-tauri/scripts/stage-sidecar.sh

  provisioner:
    desc: "Build installer provisioner"
    platforms: [windows]
    dir: editor
    cmds:
      - node scripts/build-provisioner.mjs

  dev:
    desc: "Start Tauri desktop dev mode"
    deps: [prepare]
    ignore_error: true
    dir: editor
    cmds:
      - npx tauri dev --no-watch

  build:
    desc: "Build Tauri desktop app (production)"
    deps: [prepare]
    dir: editor
    cmds:
      - npx tauri build

  build:dev:
    desc: "Build Tauri desktop app (dev, no bundling)"
    deps: [prepare]
    dir: editor
    cmds:
      - npx tauri build --no-bundle

  build:dev:mac:
    desc: "Build Tauri desktop .app bundle (macOS)"
    deps: [prepare]
    dir: editor
    cmds:
      - npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

  build:dev:windows:
    desc: "Build Tauri desktop NSIS installer (Windows)"
    deps: [prepare]
    dir: editor
    cmds:
      - npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

  build:dev:linux:
    desc: "Build Tauri desktop AppImage (Linux)"
    deps: [prepare]
    dir: editor
    cmds:
      - npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

  test:
    desc: "Run Tauri/Cargo tests"
    deps: [prepare]
    dir: editor/src-tauri
    cmds:
      - cargo test

  clean:
    desc: "Clean Tauri/Cargo build artifacts"
    dir: editor
    cmds:
      - cd src-tauri && cargo clean
      - rm -rf dist build
