version: '3'

# The backend is the Rust processing service (rust/crates/rustling-processing).
# These tasks are thin delegates to the rust:* taskfile, which owns the cargo
# invocations, so `backend:*` stays the stable entry point for callers.

tasks:
  dev:
    desc: "Start backend dev server"
    vars:
      PORT: '{{.PORT | default "8080"}}'
      AIENGINE_URL: '{{.AIENGINE_URL | default "http://localhost:5001"}}'
      AIENGINE_ENABLED: '{{.AIENGINE_ENABLED | default "false"}}'
      AIENGINE_TIMEOUTSECONDS: '{{.AIENGINE_TIMEOUTSECONDS | default "120"}}'
    cmds:
      - task: :rust:run
        vars:
          PORT: '{{.PORT}}'
          AIENGINE_URL: '{{.AIENGINE_URL}}'
          AIENGINE_ENABLED: '{{.AIENGINE_ENABLED}}'
          AIENGINE_TIMEOUTSECONDS: '{{.AIENGINE_TIMEOUTSECONDS}}'

  install:
    desc: "Fetch backend dependencies"
    cmds:
      - task: :rust:install

  build:
    desc: "Full backend build"
    cmds:
      - task: :rust:build

  test:
    desc: "Run backend tests"
    cmds:
      - task: :rust:test

  lint:
    desc: "Run backend linting"
    cmds:
      - task: :rust:lint

  format:
    desc: "Auto-fix code formatting"
    cmds:
      - task: :rust:format

  format:check:
    desc: "Check code formatting"
    cmds:
      - task: :rust:format:check

  fix:
    desc: "Auto-fix backend"
    cmds:
      - task: format

  check:
    desc: "Backend quality gate"
    cmds:
      - task: :rust:check

  clean:
    desc: "Clean build artifacts"
    cmds:
      - task: :rust:clean
