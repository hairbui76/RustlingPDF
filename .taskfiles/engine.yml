version: '3'

tasks:
  install:
    desc: "Fetch AI engine dependencies"
    cmds:
      - cargo fetch --manifest-path rust/Cargo.toml --locked

  prepare:
    desc: "Prepare the AI engine workspace"
    deps: [install]
    cmds:
      - cargo metadata --manifest-path rust/Cargo.toml --no-deps --format-version 1

  build:
    desc: "Build AI engine binaries"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo build --manifest-path rust/Cargo.toml -p rustling-ai-engine --bins --locked

  run:
    desc: "Run the AI engine server"
    deps: [":rust:clean:deps"]
    ignore_error: true
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5001"}}'
    env:
      RUSTLING_ENGINE_HOST: '{{.HOST}}'
      RUSTLING_ENGINE_PORT: '{{.PORT}}'
    cmds:
      - cargo run --manifest-path rust/Cargo.toml -p rustling-ai-engine --bin rustling-ai-engine --locked

  dev:
    desc: "Start the AI engine for development"
    deps: [":rust:clean:deps"]
    ignore_error: true
    vars:
      HOST: '{{.HOST | default "127.0.0.1"}}'
      PORT: '{{.PORT | default "5001"}}'
    env:
      RUSTLING_ENGINE_HOST: '{{.HOST}}'
      RUSTLING_ENGINE_PORT: '{{.PORT}}'
    cmds:
      - cargo run --manifest-path rust/Cargo.toml -p rustling-ai-engine --bin rustling-ai-engine --locked

  lint:
    desc: "Run AI engine linting"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo clippy --manifest-path rust/Cargo.toml -p rustling-ai-engine --all-targets --locked -- -D warnings

  lint:fix:
    desc: "Auto-fix AI engine lint issues"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo clippy --manifest-path rust/Cargo.toml -p rustling-ai-engine --all-targets --locked --fix --allow-dirty --allow-staged

  typecheck:
    desc: "Run AI engine type checking"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo check --manifest-path rust/Cargo.toml -p rustling-ai-engine --all-targets --locked

  format:
    desc: "Auto-fix AI engine formatting"
    cmds:
      - cargo fmt --manifest-path rust/Cargo.toml --package rustling-ai-engine

  format:check:
    desc: "Check AI engine formatting"
    cmds:
      - cargo fmt --manifest-path rust/Cargo.toml --package rustling-ai-engine --check

  test:
    desc: "Run AI engine tests"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo test --manifest-path rust/Cargo.toml -p rustling-ai-engine --locked

  fix:
    desc: "Auto-fix AI engine source"
    cmds:
      - task: format
      - task: lint:fix
      - task: format

  container:check:
    desc: "Verify AI engine container and operational configuration"
    deps: [":rust:clean:deps"]
    cmds:
      - cargo test --manifest-path rust/Cargo.toml -p rustling-ai-engine --test operational_cutover --locked

  check:
    desc: "Run the AI engine quality gate"
    cmds:
      - task: format:check
      - task: typecheck
      - task: lint
      - task: test

  # The OpenAPI spec (SwaggerDoc.json) is committed at the repo root; the
  # catalog generator reads it directly.
  tool-models:
    desc: "Generate the Rust AI operation catalog from the OpenAPI spec"
    cmds:
      - >
        cargo run --manifest-path rust/Cargo.toml
        -p rustling-operation-catalog --locked --
        --spec SwaggerDoc.json
        --output rust/crates/rustling-ai-engine/src/operation_catalog.json
        --mcp-supplement rust/crates/rustling-processing/src/mcp_operation_supplement.json
    sources:
      - SwaggerDoc.json
      - rust/Cargo.toml
      - rust/Cargo.lock
      - rust/crates/rustling-operation-catalog/Cargo.toml
      - rust/crates/rustling-operation-catalog/src/**/*.rs
    generates:
      - rust/crates/rustling-ai-engine/src/operation_catalog.json
      - rust/crates/rustling-processing/src/mcp_operation_supplement.json

  tool-models:check:
    desc: "Fail if the Rust AI operation catalog is out of date"
    cmds:
      - >
        cargo run --manifest-path rust/Cargo.toml
        -p rustling-operation-catalog --locked --
        --spec SwaggerDoc.json
        --output rust/crates/rustling-ai-engine/src/operation_catalog.json
        --mcp-supplement rust/crates/rustling-processing/src/mcp_operation_supplement.json
        --check

  clean:
    desc: "Clean AI engine build artifacts"
    cmds:
      - cargo clean --manifest-path rust/Cargo.toml -p rustling-ai-engine
