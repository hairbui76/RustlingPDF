[workspace]
members = [
    "crates/rustling-ai-engine",
    "crates/rustling-cli",
    "crates/rustling-operation-catalog",
    "crates/rustling-processing",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# The built-in Office→PDF engine. Published `office2pdf` 0.6.5 derives the
# filename of an extracted embedded font from strings copied verbatim out of the
# uploaded document (DOCX `w:name`, PPTX `typeface`), and `Path::join` lets an
# absolute or `..`-bearing name choose where that file is written. The pinned
# revision below is our fork with those names reduced to a sanitised single path
# component. Pinned to a commit, never a branch, so the dependency cannot move
# under us.
[patch.crates-io]
office2pdf = { git = "https://github.com/hairbui76/office2pdf.git", rev = "b62c7054c5bdd482e7d4a35f304f60cfaaa1d038" }
# `office2pdf`'s own workspace patches `umya-spreadsheet` to a panic-safety
# branch, and a `[patch]` section only takes effect in the top-level workspace.
# Without this entry we would run the XLSX path against published 2.3.3 — the
# one configuration upstream does not test — so mirror it, pinned to the commit
# that branch pointed at. (`office2pdf` patches `docx-rs` the same way, but that
# branch sits at 0.4.19 while crates.io is already at 0.4.22, so the resolver
# ignores it; mirroring it here would only add an inert git dependency.)
umya-spreadsheet = { git = "https://github.com/developer0hye/umya-spreadsheet.git", rev = "f4e2dc468dedd140f21ba967904bcbf74dcbc1c6" }

[profile.release]
# Cargo's defaults leave a lot on the table for a binary that ships inside an
# installer. Measured on rustling-processing, same machine and toolchain:
#
#                              raw        xz      build
#   cargo defaults          101.3 MB   24.3 MB   7m21s
#   lto = "thin"            72.5 MB   21.1 MB   9m45s
#   lto = "fat"              68.2 MB   20.9 MB  16m25s
#
# Read the xz column, not the raw one. Most of what LTO and `strip` remove is
# debug symbols and duplicated generic code, which compress extremely well:
# 33 MB off the raw binary is 3.4 MB off a compressed installer, overstating
# the benefit roughly eightfold.
#
# Thin is what ships (since 0.1.6). Fat shipped from 0.0.5 to 0.1.5; it bought
# 0.2 MB of installer over thin for 6m40s more build time on every leg of every
# release, and the 2026-08-25 audit (docs/plans/active/build-speed-and-app-size.md)
# measured the fat link alone at 511s on a warm build — the one stage no cache
# can shorten. Thin captures 3.2 of fat's 3.4 MB for a third of the time. Both
# were built and smoke-tested — swapping back is one word.
#
# panic stays "unwind" on purpose. Aborting would drop ~7.8 MB of unwind tables,
# but the HTTP layer isolates a panicking request handler by unwinding just that
# task; turning it into a process abort trades installer bytes for taking the
# whole service down on one malformed document.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
