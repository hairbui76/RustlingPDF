[package]
name = "rustling-cli"
version = "0.0.0"
build = "build.rs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustlingpdf"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.32"
jsonschema = { version = "0.48.0", default-features = false }
rustling-processing = { path = "../rustling-processing", features = ["paddle-ocr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
serde_json = "1.0.150"

[dev-dependencies]
lopdf = "0.44.0"
