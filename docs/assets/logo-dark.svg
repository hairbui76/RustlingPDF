<svg xmlns="http://www.w3.org/2000/svg" width="560" height="132" viewBox="0 0 560 132" role="img" aria-label="RustlingPDF">
  <title>RustlingPDF</title>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7BDA5A"/>
      <stop offset="0.45" stop-color="#60C948"/>
      <stop offset="1" stop-color="#11531B"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFE7A8"/>
      <stop offset="0.5" stop-color="#FFFFBF"/>
      <stop offset="1" stop-color="#E3D98F"/>
    </linearGradient>
  </defs>

  <!-- Book mark: cream page stack behind a green cover, matching the app icon. -->
  <g transform="translate(14 16)">
    <rect x="6" y="4" width="82" height="92" rx="11" fill="url(#pages)"/>
    <path d="M14 4h12v92H14a8 8 0 0 1-8-8V12a8 8 0 0 1 8-8z" fill="#D8CE84"/>
    <rect x="18" y="0" width="82" height="92" rx="11" fill="url(#cover)"/>
    <path d="M26 0h6v92h-6z" fill="#0E4517" opacity="0.45"/>
    <rect x="18" y="0" width="82" height="92" rx="11" fill="none" stroke="#002601" stroke-width="2.5"/>

    <!-- R drawn as a path so no font substitution can distort the mark. -->
    <g transform="translate(37 18) scale(0.62)">
      <path fill-rule="evenodd" fill="#FFFFBF" stroke="#002601" stroke-width="4" stroke-linejoin="round"
            d="M6 2h44c22 0 33 11 33 28 0 13-7 22-20 26l24 34H63L42 62h-6v28H6Z
               M36 22v22h16c9 0 13-4 13-11 0-7-4-11-13-11Z"/>
    </g>
  </g>

  <!-- Wordmark. textLength pins the advance width so a substituted font cannot break the layout. -->
  <g font-family="'Segoe UI Semibold','Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="132" y="62" font-size="42" font-weight="700" fill="#EAF7E2"
          textLength="204" lengthAdjust="spacingAndGlyphs">Rustling</text>
    <text x="344" y="62" font-size="42" font-weight="700" fill="#60C948"
          textLength="86" lengthAdjust="spacingAndGlyphs">PDF</text>
    <text x="133" y="93" font-size="16.5" font-weight="400" fill="#93AE99"
          textLength="392" lengthAdjust="spacingAndGlyphs">A pure-Rust PDF toolbox. No account, no server state.</text>
  </g>
</svg>
